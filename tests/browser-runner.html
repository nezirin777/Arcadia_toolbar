function verify(checks) {
  const failed = Object.entries(checks).filter(([, passed]) => !passed).map(([name]) => name);
  return { passed: failed.length === 0, detail: failed.length ? `失敗: ${failed.join(', ')}` : '' };
}

function applyFormats(doc, enabled = []) {
  const enabledSet = new Set(enabled);

  for (const input of inputs) {
    input.checked = enabledSet.has(input.id.replace('format-', ''));
  }
  inputs[0]?.dispatchEvent(new Event('change', { bubbles: true }));
}

function saveStorage() {
  return Object.fromEntries(STORAGE_KEYS.map(key => [key, localStorage.getItem(key)]));
}

function restoreStorage(saved) {
  for (const key of STORAGE_KEYS) {
    if (saved[key] == null) localStorage.removeItem(key);
    else localStorage.setItem(key, saved[key]);
  }
}

function installTestStorage() {
  localStorage.setItem('arcadia_config', JSON.stringify(TEST_CONFIG));
  localStorage.setItem('arcadia_favorites', JSON.stringify(TEST_FAVORITES));
  localStorage.setItem('ss-theme', 'light');
  localStorage.removeItem('style-control-bar-settings');
}

function waitForUi(win) {
  return new Promise(resolve => {
    win.requestAnimationFrame(() => win.requestAnimationFrame(() => win.setTimeout(resolve, 80)));
  });
}

async function loadTest(test, source) {
  const frame = document.getElementById('sandbox');
  const errors = [];
  frame.src = new URL(test.fixture, FIXTURE_ROOT).href + `?runner=${Date.now()}`;
  await new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = () => reject(new Error('フィクスチャを読み込めません'));
  });

  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  win.history.replaceState({}, '', test.route);
  installTestStorage();
  test.setupStorage?.();

  win.addEventListener('error', event => errors.push(event.message || 'window error'));
  const originalError = win.console.error.bind(win.console);
  win.console.error = (...args) => {
    errors.push(args.map(String).join(' '));
    originalError(...args);
  };

  const script = doc.createElement('script');
  script.textContent = `${source}\n//# sourceURL=Arcadia_toolbar_next.test.js`;
  doc.documentElement.appendChild(script);
  await waitForUi(win);

  const pageshow = new win.Event('pageshow');
  Object.defineProperty(pageshow, 'persisted', { value: true });
  win.dispatchEvent(pageshow);
  await waitForUi(win);

  let passed = false;
  let detail = '';
  try {
    const checked = await test.check(doc, win);
    if (checked && typeof checked === 'object') {
      passed = !!checked.passed;
      detail = checked.detail || '';
    } else {
      passed = !!checked;
    }
  }
  catch (error) { errors.push(error.stack || error.message); }

  const singleton = doc.querySelectorAll('.theme-toggle').length === 1;
  return { passed: passed && errors.length === 0 && singleton, errors, singleton, detail };
}

function addResult(test, status, detail = '') {
  const row = document.createElement('tr');
  row.innerHTML = `<td><code>${test.id}</code></td><td><code>${test.fixture || '全画面'}</code></td><td></td><td class="${status === 'OK' ? 'ok' : status === 'NG' ? 'ng' : 'running'}">${status}</td><td></td>`;
  row.cells[2].textContent = test.label;
  row.cells[4].textContent = detail;
  document.getElementById('results').appendChild(row);
  return row;
}

document.getElementById('run').addEventListener('click', async event => {
  const button = event.currentTarget;
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');
  const savedStorage = saveStorage();
  button.disabled = true;
  results.replaceChildren();
  summary.textContent = ' 実行中…';

  let ok = 0;
  const outcomes = new Map();
  try {
    const response = await fetch(SCRIPT_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error(`Userscript読込失敗: HTTP ${response.status}`);
    const source = await response.text();

    for (const test of TESTS) {
      const row = addResult(test, '実行中');
      const outcome = await loadTest(test, source);
      outcomes.set(test.id, outcome);
      const status = outcome.passed ? 'OK' : 'NG';
      row.cells[3].className = outcome.passed ? 'ok' : 'ng';
      row.cells[3].textContent = status;
      row.cells[4].textContent = outcome.errors.join(' / ') || outcome.detail || (outcome.singleton ? '' : 'pageshow後にUIが重複');
      if (outcome.passed) ok++;
    }

    const partial = ['T-01', 'T-02', 'T-03', 'T-09', 'T-11'].every(id => outcomes.get(id)?.passed);
    const t14 = { id: 'T-14', fixture: '一覧4種', label: 'お気に入り・NGのタイトル部分一致' };
    addResult(t14, partial ? 'OK' : 'NG', partial ? '' : '関連する一覧テストに失敗');
    if (partial) ok++;

    const stable = Array.from(outcomes.values()).every(value => value.errors.length === 0 && value.singleton);
    const t15 = { id: 'T-15', fixture: '全画面', label: '例外なし・pageshow後も二重初期化なし' };
    addResult(t15, stable ? 'OK' : 'NG', stable ? '' : '例外またはUI重複を検出');
    if (stable) ok++;

    const total = TESTS.length + 2;
    summary.textContent = ` ${ok}/${total} 件 OK`;
    summary.className = ok === total ? 'ok' : 'ng';
  } catch (error) {
    summary.textContent = ` 実行失敗: ${error.message}`;
    summary.className = 'ng';
  } finally {
    restoreStorage(savedStorage);
    button.disabled = false;
  }
});
</script>
</body>
</html>
